name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Leak scan
        run: ./scripts/leak-scan.sh
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
  validate-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate marketplace and plugin
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
          claude plugin validate plugins/creator-management-inbox
          claude plugin validate plugins/your-voice
